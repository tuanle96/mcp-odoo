# Mcp Odoo Workflow Add Example Integration And Documentation

## Action

Follow the add-example-integration-and-documentation workflow:
1. Create or update an example directory under examples/
2. Add or update a README.md with setup or usage instructions
3. Add or update configuration files (e.g., settings.json) specific to the integration
4. Optionally update CHANGELOG.md to document the addition

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: examples/<integration-name>/README.md, examples/<integration-name>/settings.json, examples/README.md

